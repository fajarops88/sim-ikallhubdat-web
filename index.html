<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>SIM IKALLHUBDAT — DPD Kalimantan Timur</title>

  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            'primary': '#0B2A5B',
            'primary-dark': '#061633',
            'on-primary': '#FFFFFF',
            'gold': '#D4A72C',
            'gold-light': '#FCD34D',
            'gold-dark': '#B45309',
            'surface': '#F4F6FA',
            'surface-card': '#FFFFFF',
            'ink': '#111C2D',
            'ink-soft': '#44474F',
            'outline': '#747780',
            'outline-variant': '#E2E8F0'
          },
          fontFamily: {
            'head': ['Montserrat', 'sans-serif'],
            'body': ['Inter', 'sans-serif']
          },
          borderRadius: { DEFAULT: '0.375rem', lg: '0.5rem', xl: '0.75rem', full: '9999px' }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="font-body bg-surface text-ink antialiased">

  <!-- Loading Overlay awal -->
  <div id="loadingOverlay" class="loading-overlay">
    <div class="app-spinner"></div>
    <p class="mt-4 font-label text-sm text-ink-soft">Memuat SIM IKALLHUBDAT…</p>
  </div>

  <!-- Topbar Horizontal (disembunyikan sampai login) -->
  <header id="topbar" class="topbar hidden">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <div id="logoWrap" class="topbar-logo"></div>
        <div class="topbar-brand-text">
          <span class="topbar-title">SIM IKALLHUBDAT</span>
          <span class="topbar-subtitle">DPD Kalimantan Timur</span>
        </div>
      </div>
      <nav id="topbarNav" class="topbar-nav"></nav>
      <div class="topbar-actions">
        <!-- Dropdown "Lainnya" SENGAJA ditaruh di luar #topbarNav (bukan di
             dalamnya) — #topbarNav punya overflow-x:auto untuk baris menu yang
             bisa digeser, dan CSS memaksa overflow-y ikut jadi 'auto' begitu
             overflow-x diisi apa pun selain 'visible' (aturan spesifikasi
             CSS), sehingga menu dropdown yang posisinya absolute akan
             KEPOTONG/tidak kelihatan sama sekali kalau ditaruh di dalam
             #topbarNav. Ditaruh di sini (di dalam .topbar-actions yang tidak
             punya overflow apa pun) supaya dropdown-nya bisa muncul normal. -->
        <div id="topbarMoreWrap" class="topbar-more"></div>
        <span class="gas-status-pill"><span class="dot"></span> GAS Connected</span>
        <button class="topbar-icon-btn" onclick="toggleDarkMode()" title="Ganti Tema"><span class="material-symbols-outlined text-[20px]">dark_mode</span></button>
        <button class="topbar-icon-btn" title="Notifikasi"><span class="material-symbols-outlined text-[20px]">notifications</span></button>
        <div class="topbar-user" onclick="handleLogout()" title="Klik untuk keluar">
          <div class="topbar-user-avatar" id="topbarUserAvatar">?</div>
          <div class="topbar-user-text">
            <span class="topbar-user-name" id="topbarUserName">Pengguna</span>
            <span class="topbar-role-badge" id="topbarUserRole">-</span>
          </div>
        </div>
        <button id="mobileMenuBtn" class="mobile-menu-btn" onclick="toggleMobileMenu()"><span class="material-symbols-outlined text-[26px]">menu</span></button>
      </div>
    </div>
    <div id="mobileMenuPanel" class="mobile-menu-panel hidden"></div>
  </header>

  <!-- Kontainer Utama SPA -->
  <main id="mainContent" class="main-content">
    <div id="app-container"></div>
  </main>

  <!-- Toast -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Modal Konfirmasi generik -->
  <div id="confirmModal" class="modal-backdrop hidden">
    <div class="modal-card">
      <h3 id="confirmTitle" class="font-head font-semibold text-lg text-ink mb-2">Konfirmasi</h3>
      <p id="confirmBody" class="text-sm text-ink-soft mb-5"></p>
      <div id="confirmExtra" class="mb-4"></div>
      <div class="flex justify-end gap-2">
        <button onclick="closeConfirmModal()" class="btn-secondary">Batal</button>
        <button id="confirmActionBtn" class="btn-danger">Lanjutkan</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
